<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireSphere - Project Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #080c14;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .portal-card {
            background: #0e1626;
            border: 1px solid #1e293b;
            border-radius: 24px;
            max-width: 580px;
            width: 100%;
            padding: 40px 36px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 230, 118, 0.1);
        }
        .logo-box {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #00e676 0%, #00a843 100%);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.5rem;
            box-shadow: 0 4px 18px rgba(0, 230, 118, 0.4);
            margin-bottom: 16px;
        }
        .btn-launch-live {
            background-color: #00e676;
            color: #050811 !important;
            font-weight: 800;
            border-radius: 14px;
            padding: 14px 24px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.35);
        }
        .btn-launch-live:hover {
            background-color: #00ff84;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0, 230, 118, 0.5);
        }
        .btn-launch-showcase {
            background-color: #131d33;
            color: #f8fafc !important;
            font-weight: 700;
            border: 1px solid #273552;
            border-radius: 14px;
            padding: 14px 24px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
        }
        .btn-launch-showcase:hover {
            border-color: #00e676;
            background-color: #1a2744;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="portal-card text-center">
    <div class="logo-box">
        <i class="fas fa-cube"></i>
    </div>
    <h2 class="fw-bold mb-1">HireSphere</h2>
    <p class="text-white-50 small mb-4">KTU B.Tech Computer Science &amp; Engineering Mini Project</p>

    <div class="d-grid gap-3 mb-4 text-start">
        <a href="http://127.0.0.1:8000/" target="_blank" class="btn-launch-live">
            <div>
                <div class="fw-bold fs-6"><i class="fas fa-server me-2"></i>Live Django Application</div>
                <small class="opacity-75" style="font-weight: 500;">Database, Auth, Resume Analyzer &amp; Quizzes (Port 8000)</small>
            </div>
            <i class="fas fa-arrow-right fs-5"></i>
        </a>

        <a href="frontend/index.html" class="btn-launch-showcase">
            <div>
                <div class="fw-bold fs-6"><i class="fas fa-laptop-code me-2"></i>Frontend UI Showcase</div>
                <small class="text-white-50">Static report presentation screens (Fig 4.1 to 4.6)</small>
            </div>
            <i class="fas fa-arrow-right fs-5 text-secondary"></i>
        </a>
    </div>

    <div class="pt-3 border-top border-secondary border-opacity-25 d-flex justify-content-between align-items-center small text-white-50">
        <a href="docs/report 4.pdf" target="_blank" class="text-white-50 text-decoration-none">
            <i class="fas fa-file-pdf text-danger me-1"></i>Project Report PDF
        </a>
        <span>&copy; 2025 HireSphere.&nbsp;&nbsp;&nbsp;&nbsp;Academic project.</span>
    </div>
</div>

</body>
</html>
