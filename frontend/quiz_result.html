<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireSphere - Assessment Result</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --hs-green: #00b848;
            --hs-green-hover: #009e3e;
            --hs-green-light: #dcf5e7;
            --hs-green-dark: #005a26;
            --hs-bg: #f3f8f5;
            --hs-dark: #111827;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--hs-bg);
            color: var(--hs-dark);
            min-height: 100vh;
        }
        
        
        
        .card-hs {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }
        .btn-hs-green {
            background-color: var(--hs-green);
            color: #ffffff !important;
            font-weight: 700;
            border-radius: 30px;
            padding: 0.75rem 2.5rem;
            border: none;
            box-shadow: 0 4px 14px rgba(0, 184, 72, 0.25);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
    </style>
</head>
<body>



<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 text-center">
            <div class="card-hs p-5">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px; background: #dcf5e7; color: #00b848;">
                    <i class="fas fa-award fa-3x"></i>
                </div>

                <span class="badge bg-light text-success fw-bold text-uppercase px-3 py-2 rounded-pill mb-2">ASSESSMENT PASSED</span>
                <h2 class="fw-extrabold text-dark mb-1">Congratulations!</h2>
                <p class="text-secondary mb-4">You have successfully demonstrated competency in <b>Python Programming</b>.</p>

                <!-- Circular Gauge -->
                <div class="position-relative d-inline-block mx-auto mb-4" style="width: 150px; height: 150px;">
                    <svg width="150" height="150" viewBox="0 0 140 140">
                        <circle cx="70" cy="70" r="54" fill="none" stroke="#e1f5eb" stroke-width="12"/>
                        <circle cx="70" cy="70" r="54" fill="none" stroke="#00b848" stroke-width="12"
                                stroke-dasharray="339.29"
                                stroke-dashoffset="33.9"
                                stroke-linecap="round"
                                transform="rotate(-90 70 70)"/>
                    </svg>
                    <div class="position-absolute top-50 start-50 translate-middle text-center" style="line-height: 1;">
                        <div class="fw-extrabold text-dark" style="font-size: 2rem;">90%</div>
                        <div class="fw-bold mt-1 text-success" style="font-size: 0.75rem;">VERIFIED</div>
                    </div>
                </div>

                <div class="p-3 rounded-4 bg-light border mb-4 text-start">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted small">Passing Threshold:</span>
                        <span class="fw-bold text-dark small">70%</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted small">Your Score:</span>
                        <span class="fw-bold text-success small">90% (Passed)</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted small">Profile Status:</span>
                        <span class="badge bg-success small">Verified Badge Added</span>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <a href="profile.html#sectionResume" class="btn-hs-green">
                        <i class="fas fa-user-check me-2"></i>View in Candidate Profile
                    </a>
                    <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4">
                        Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
