{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Apply - {{ job.title }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow"><div class="card-header bg-success text-white"><h4 class="mb-0"><i class="fas fa-paper-plane me-2"></i>Apply for {{ job.title }}</h4></div><div class="card-body"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form|crispy }}<button class="btn btn-success w-100 mt-3" type="submit">Submit Application</button></form></div></div></div></div>
{% endblock %}
